name: Deploy to Azure Web App

on:
  push:
    branches: [azure-sts-flow-docs]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for Azure OIDC login
  contents: read

concurrency:
  group: azure-webapp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server dependencies (production only)
        run: npm ci --omit=dev

      - name: Build client
        run: |
          npm --prefix client ci
          npm --prefix client run build

      - name: Package for deployment
        run: |
          mkdir -p deploy/client
          cp -r server node_modules package.json package-lock.json deploy/
          cp -r client/dist deploy/client/dist
          cd deploy && zip -qr ../release.zip .

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip

      - name: Azure logout
        if: always()
        run: az logout
